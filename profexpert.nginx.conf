server {
    server_name profekspert.site www.profekspert.site;

    root /var/www/profexpert;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        text/xml
        image/svg+xml;

    # Security & Performance Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Cache static assets: 365 days, immutable
    location ~* \.(?:css|js|webp|avif|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # API endpoints handled by Python PM2 backend
    location /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Clean HTML URLs and static file serving
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/profekspert.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/profekspert.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.profekspert.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = profekspert.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name profekspert.site www.profekspert.site _;
    return 404; # managed by Certbot
}
